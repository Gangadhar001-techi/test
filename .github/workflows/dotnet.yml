trigger:
- main

variables:
- group: my-variable-group   # Variable group name

jobs:
- job: ReadVariableGroup
  displayName: Read variables from group

  pool:
    vmImage: ubuntu-latest

  steps:
  - script: |
      echo "Value of myVariable: $(myVariable)"
      echo "Value of anotherVar: $(anotherVar)"
    displayName: Print variable group values
